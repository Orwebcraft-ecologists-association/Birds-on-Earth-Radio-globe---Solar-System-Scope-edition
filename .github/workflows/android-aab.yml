name: Build Android App Bundle (TWA)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Android project exists
        run: |
          test -f twa-manifest.json || {
            echo "::error::Generate the Bubblewrap Android project in android/ before running this workflow."
            exit 1
          }

      - name: Check signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Configure the four Android signing secrets described in docs/GOOGLE_PLAY.md."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Restore signing keystore from GitHub secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          chmod 600 "$RUNNER_TEMP/upload-key.jks"

      - name: Build signed Android App Bundle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          bubblewrap build \
            --signingKeyPath="$RUNNER_TEMP/upload-key.jks" \
            --signingKeyAlias="$KEY_ALIAS"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: birds-on-earth-radio-play-aab
          path: android/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 7
